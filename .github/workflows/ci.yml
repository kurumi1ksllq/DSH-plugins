name: ci

# Minimal gate: the same commands the repo already trusts locally.
# `pnpm verify` is the packaging contract (bundle metadata, artifacts, profile,
# version discipline); `pnpm test` runs every package's `node --test` suite.
# The job id `test` is what branch protection should require.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify packaging
        run: pnpm verify

      - name: Test
        run: pnpm test
