name: ci

# The repo's own gate, run on every PR.
#
# The whole workspace is gated again. It had been narrowed to two packages
# because dsh-credential-vault imported `@deepseek-ai/dsh-tools` without it being
# resolvable on a clean runner, turning every PR red for a reason unrelated to its
# own change (issue #28). That package is now resolved lazily with a
# contract-compatible fallback, so a runner without the DSH runtime still works.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: docs-contract resolves the commit a calibration block
      # names, and a shallow PR checkout does not contain it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # dsh-deep-ptc-mode (upstream) requires node >=24; every other
          # bundle declares ^22.19.0 || >=24.0.0, so the whole workspace runs
          # on the newer line. See docs/specs/deep-ptc-integration.md.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--frozen-lockfile` exits 0 and still rewrites pnpm-lock.yaml when the
      # importers are out of step, so the file has to be compared before/after.
      - name: Lockfile unchanged by install
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Verify packaging (whole workspace)
        run: pnpm verify

      - name: Test (whole workspace)
        run: pnpm test
