# ---------------------------------------------------------------------------
# 2026-10-25 token 收紧（全局生效，不建 preset、不需要切档）
#
# 依据：applyEntryPatches 的 entryMap 会递归 group 内部，所以这两个 id 虽然
# 嵌在 base 组合包的 isolate group 里，profile patch 依然能按 id 命中。
# 注意语义是「patch config 整体替换」——这里省略的键回落到插件 schema 默认值
# （headroomTokens 65536 / maxTokens 65536 / auto true 等，与默认一致）。
#
# 默认 0.8 × 512000 ≈ 131k 才压缩；2026-10-28 起按预算方案压到 0.3：
# 压缩线 = min(512000 × 0.3, 512000 − 65536 − 65536) = 153,600 token，
# 保留尾部 0.1 × 512000 ≈ 44.6k。实测依据见 E:/Project-hub/dsh-ctx-guard/
# context-budget-plan-2026-10-28.md（原 0.55 时压缩线 281.6k，几乎不触发）。
# 代价：每次触发是一次全价摘要请求 + 一次前缀缓存重建；<250k 就结束的短会话可能更贵。
# ---------------------------------------------------------------------------
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.3
    retainRatio: 0.1

# save-token：只覆盖 keepRatioMax（原默认 0.72 → 0.5）。按 id 的 patch 整体替换
# config，其余键回落到插件代码默认值，与 bundle patch 里那段完全一致（已逐键核对）。
- id: save-token
  config:
    keepRatioMax: 0.5

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 4096
    headChars: 2048
    tailChars: 512

# >>> reviewer-readonly preset (2026-10-25 — dsh-doublecheck adversary review)
# 只读评审 preset：只有 read / glob / grep，没有 write / edit / 终端 / 网络。
# doublecheck-guard 的 adversaryPreset 指向它。本机 host 用 subagents.startActivation，
# 缺这个 preset 时对抗评审会以 unavailable 返回，而不是伪造一个评审结论。
# 回滚：删掉本块 + 删掉 doublecheck-guard 里的 adversaryPreset 行。
- insert:
    - id: preset-reviewer-readonly
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reviewer-readonly
        name: 'Reviewer (read-only)'
        description: 'Read-only adversarial critic for dsh-doublecheck: read/glob/grep
          only.'
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an adversarial reviewer. Assume the delivery fails its own spec.
                Read the repository and the session evidence, then report only the strongest
                objections you can support with citations. Never edit, write, or run mutating commands.
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
# <<< reviewer-readonly preset

# mcp-workspace-gate 已并入 dsh-inventory（E:/Project-hub/dsh-inventory），
