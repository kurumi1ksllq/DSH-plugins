# ---------------------------------------------------------------------------
# dsh-tool-search@0.1.8 — 长尾工具折叠（2026-10-24 装）
#
# 实测依据（diagnostics/test-audit-2026-10-24.js 可复算）：
#   当前工具头 99 个工具 / 182.4k 字符 ≈ 57k token/请求，其中
#   davinci-resolve 37 个工具占 126.8k（69.5%），61 个会话 4134 次调用里 0 次。
#   本插件把它们折叠到 tool_search / tool_describe / tool_call 三个桥后面，
#   能力保留、schema 按需注入 → 预计每请求省 ~43k token。
#
# core 白名单是硬要求，不是调优：插件默认只放行 todo_write + 桥 + skill，
# 其余全部延迟。漏掉哪个高频工具，那个工具就要每次先 tool_call 绕一层，
# 效率反而下降。下面 12 个是本机实测调用量最高的工具（pwsh 2216 次、
# read 409、edit 373、write 281、grep 66、web_fetch 57…）。
# ---------------------------------------------------------------------------
- id: tool-search
  name: dsh-tool-search
  config:
    enabled: auto
    thresholdPct: 5
    # 4000 → 800（2026-10-28 预算方案 A3，可回滚）：listing 预算 =
    # min(thresholdPct% × contextWindow, listingMaxTokens) = 800，工具清单一页给不完，
    # 长尾工具靠 tool_search 命中即 warm。回滚：改回 4000。
    listingMaxTokens: 800
    minCatalogSize: 12
    # 8 → 3：实测 tool_search 一次查询会把命中的工具全部 warm 进来，
    # 而 davinci 的工具单个 2k~19k 字符，warm 6 个就把 schema 从 13.4k 顶回 53.9k。
    # 上限压到 3，把"搜一下"的代价封住。
    maxWarmTools: 3
    core:
      - todo_write
      - ask_user_question
      - present
      - read
      - write
      - edit
      - grep
      - glob
      - pwsh
      - web_fetch
      - skill
      - save_token_expand
      # 2026-10-25 追加：这 7 个是「会话里会用 1-3 次」的中频工具。
      # 走桥 = 每次 warm 都把工具集改一次 = prompt 前缀缓存全价重建（实测每次 43k-74k 全价 token）。
      # 常驻进 core 的代价只是稳定前缀 +2~3k（缓存读 ≈250 tok 有效），换来零断裂。
      - job_output
      - web_search
      - read_image
      - session_search
      - subagent
      - send_message
      - list_agents

