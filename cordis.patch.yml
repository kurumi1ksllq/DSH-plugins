# Bundle patch layer for dsh-inventory.
# Two host-side rows:
#   inventory       — the read-only aggregator plus GET /inventory/snapshot
#   inventory-gate  — mounts MCP servers only for sessions whose workspace
#                     declares them in <workspace>/.dsh/mcp.json
# The gate row's serverNameSuffix is read back by the inventory snapshot so the
# page can show the tool name the gate will actually mount. No config override
# is written here; defaults live in each entry.
- insert:
    - id: inventory
      name: "dsh-inventory"
    - id: inventory-gate
      name: "dsh-inventory/gate"
      config:
        serverNameSuffix: "-ws"
