# Bundle patch layer for dsh-plugin-sync.
#
# One host-side row. `config` is deliberately absent: a profile patch that
# targets this row replaces the whole `config` object, so defaults live in
# lib/config.js (DEFAULTS) and a profile only restates what it changes.
#
# Off by default: `repo` is empty, so the plugin loads and idles without
# touching the network. Enable it in the profile patch with:
#
#   - id: plugin-sync
#     config:
#       repo: https://github.com/<owner>/<repo>.git
#       ref: main
#       apply: true
#
- insert:
    - id: plugin-sync
      name: "dsh-plugin-sync"
