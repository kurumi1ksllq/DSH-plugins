# Bundle patch for dsh-task-dispatcher.
#
# One host row. The plugin injects ONE runtime-context segment through the
# systemPrompt service; its text carries two sections:
#   1. delegation discipline (decompose first, size-based lanes, teammate
#      authorization to delegate downward)
#   2. a role table (examples of delegable specialist roles, plus how to reach
#      the rest) — the model finds a role id with `role_search` and starts the
#      child with `delegate_role` (#207).
#
# `subagent`'s `agent_preset` argument is deliberately NOT advertised: it mounts
# a whole preset composition, and the 133 ECC presets declare only a persona, so
# such a child has no file tools and no persona. dsh-deep-ptc-mode stopped
# stamping `allowedAgentPresets`, which is what used to expose that argument.
- insert:
    - id: task-dispatcher
      name: 'dsh-task-dispatcher'
