# Host-side settings register a scoped deep-ptc preset; the absorbed
# stall-governor and git-bash-tool rows keep their historical row ids, with
# name pointing at subpath exports of this package (never the main entry, so
# nothing is loaded three times).
- insert:
    - id: deep-ptc-settings
      name: dsh-deep-ptc-mode
      config:
        environment: auto
        wslDistribution: ''
# issue-236: the single-run_code deadline is this row's config, not a constant in
# the runtime. @deepseek-ai/dsh-base declares the row with NO config, so its
# loader defaults apply: timeoutMs 120s / maxTimeoutMs 600s. A foreground tool
# (ralph is one) runs entirely inside one program, so 600s cut it off mid-batch.
# 30 minutes covers the slowest round measured on this machine (577s) with room
# to spare; the runtime accepts anything up to MAX_TIMER_DELAY_MS (~24.8 days).
# Long targets still batch — see the "run_code deadline" section of README.zh.md.
- id: ptc-runtime
  config:
    timeoutMs: 600000
    maxTimeoutMs: 1800000
# Row overrides absorbed from dsh-git-bash-tool: enable the bash tool, disable
# the pwsh tool. The timeoutMs is restated verbatim: a patch hit replaces the
# row config wholesale.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: false
  config:
    timeoutMs: 60000
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false
- id: tool-pwsh
  disabled: true
- insert:
    - id: dsh-stall-governor
      name: dsh-deep-ptc-mode/governor
    - id: git-bash-tool
      name: dsh-deep-ptc-mode/git-bash
