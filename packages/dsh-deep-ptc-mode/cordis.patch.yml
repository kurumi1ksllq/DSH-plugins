# Host-side settings register a scoped deep-ptc preset; the absorbed
# stall-governor and git-bash-tool rows keep their historical row ids, with
# name pointing at subpath exports of this package (never the main entry, so
# nothing is loaded three times).
- insert:
    - id: deep-ptc-settings
      name: dsh-deep-ptc-mode
      config:
        environment: auto
        wslDistribution: ''
# issue-236: a foreground tool (ralph is one) runs its whole loop inside ONE
# run_code program, so the program's ceiling is the batch length. That ceiling is
# this row's config, not a constant in the runtime: @deepseek-ai/dsh-base declares
# the row with NO config, so the loader defaults (120s default / 600s cap) apply.
#
# Only the CAP is raised. The default stays 120s on purpose: a program's deadline
# is also its uninterruptible window (steering is read at step boundaries, and the
# deep-ptc guard makes job_output / ask_user_question steerable but cannot interrupt
# a running program), so raising the default would stretch every ordinary program's
# blackout from 2 to 10 minutes. Long work opts in with an explicit run_code
# timeoutMs instead — the tool description prints the default and the cap.
#
# Scope: a bare-id patch edits the profile row in place, so this applies to every
# preset in this profile, not only deep-ptc sessions. The visible effect elsewhere
# is only that a caller MAY ask for a longer budget.
- id: ptc-runtime
  config:
    maxTimeoutMs: 1800000
# Row overrides absorbed from dsh-git-bash-tool: enable the bash tool, disable
# the pwsh tool. The timeoutMs is restated verbatim: a patch hit replaces the
# row config wholesale.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: false
  config:
    timeoutMs: 60000
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false
- id: tool-pwsh
  disabled: true
- insert:
    - id: dsh-stall-governor
      name: dsh-deep-ptc-mode/governor
    - id: git-bash-tool
      name: dsh-deep-ptc-mode/git-bash
