# dsh-stall-governor bundle patch: mount the merged stall-governor plugin.
#
# Applied when this bundle appears in a profile's dsh.profile.bundles list.
# Host half only. One package, two engines sharing assembly/settings/client/
# event facilities:
#   「单流内」 engine (from dsh-cot-anchor): agent/soft-cut single decision
#     point (probe-gated), tools/post-execute INVALID_ARGS recovery injection,
#     command-execution discipline fixed segment.
#   「跨步骤」 engine (from dsh-step-governor): agent/pre-step reject step-level
#     circuit breaker (shadow by default), tools/pre-execute deny branch
#     circuit breaker, soft-cut-suppressed escalation.
# New ids throughout: row id, PLUGIN_SOURCE kind, route prefix
# /plugins/stall-governor, storage storages/stall-governor.json,
# settings section order 997.
- insert:
    - id: dsh-stall-governor
      name: dsh-stall-governor
