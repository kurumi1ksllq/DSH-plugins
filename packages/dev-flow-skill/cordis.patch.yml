# Bundle patch layer for dev-flow-skill.
#
# One host-side row: the package's own entry (`index.js`), which registers the
# `dev-flow` skill into `ctx.skills` with the shipped `SKILL.md` body read at
# apply time. No config is written here on purpose — the row has no `Config`
# schema, and the skill's name/description/body all come from the package itself
# so a profile cannot silently point it at some other document.
- insert:
    - id: dev-flow-skill
      name: "dev-flow-skill"
